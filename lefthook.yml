pre-commit:
  commands:
    biome:
      glob: "*.{js,ts,json,jsonc}"
      run: bunx --no-install biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    eslint:
      glob: "*.{js,ts}"
      run: bunx --no-install pulse-eslint --no-warn-ignored --no-error-on-unmatched-pattern {staged_files}
