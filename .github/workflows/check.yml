name: Check

on:
  workflow_call:
    inputs:
      build:
        description: Also run the build and check that dist is up to date.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        if: ${{ inputs.build }}
        run: bun run build
      - name: Check dist is up to date
        if: ${{ inputs.build }}
        run: git diff --exit-code -- dist
      - name: Test
        run: bun run test
